# Dependency vulnerabilities, reported back to the Content Studio.
#
# The studio's scheduler dispatches this MONTHLY (and on demand), waits for the
# run, and reads the MONITOR_AUDIT line below into the project's "Deps" tag and
# the Monitoring dashboard's advisories list. Nothing is committed here and no
# secret is needed.
#
# The audit command must NOT fail this workflow when vulnerabilities exist
# (report, don't gate) — a red run means the tooling itself broke.
name: Audit

on:
  workflow_dispatch: # the studio's scheduler is the only trigger

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # GHSA ids left out of the report, comma-separated. Only advisories with
    # no patched release belong here, each with its reason and exit condition:
    #   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3 has no patched release (checked
    #     2026-10-20). Reached only through the lint toolchain:
    #     eslint-config-next > @next/eslint-plugin-next > fast-glob 3.3.1
    #     (pinned) > micromatch. Remove once braces 3.0.4 ships and the
    #     lockfile is refreshed.
    env:
      AUDIT_IGNORE: GHSA-vfj7-8cjw-p6xm
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Lockfile-only: no install. `|| true` is load-bearing — pnpm audit
      # exits non-zero when vulns exist, which is the normal case being
      # reported. pnpm emits the npm-v6 report shape.
      - name: Audit dependencies
        run: pnpm audit --json > audit.json || true

      # `always()`: a failing audit step still wrote what it wrote, and a
      # MISSING report must emit NOTHING (reads as "No report"), never zeros.
      #
      # Counts come from the advisories, not metadata.vulnerabilities, so an
      # AUDIT_IGNORE entry leaves the counts as well as the list — pnpm's own
      # ignore setting filters the list but leaves the metadata untouched.
      - name: Report to the studio
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const ignore = new Set(
              String(process.env.AUDIT_IGNORE || "")
                .split(/[\s,]+/)
                .filter(Boolean)
                .map((id) => id.toUpperCase()),
            );
            let out = null;

            try {
              const a = JSON.parse(fs.readFileSync("audit.json", "utf8"));

              if (a.metadata && a.metadata.vulnerabilities) {
                const counts = { critical: 0, high: 0, moderate: 0, low: 0 };
                const advisories = [];
                const ignored = [];
                for (const v of Object.values(a.advisories || {})) {
                  const id = String(v.github_advisory_id || "");
                  if (ignore.has(id.toUpperCase())) {
                    ignored.push(id);
                    continue;
                  }
                  const severity = String(v.severity || "unknown").toLowerCase();
                  if (severity === "critical") counts.critical++;
                  else if (severity === "high") counts.high++;
                  else if (severity === "low" || severity === "info") counts.low++;
                  else counts.moderate++; // moderate, medium, unknown — never silently green
                  if (advisories.length < 20)
                    advisories.push({
                      package: v.module_name,
                      severity,
                      ...(v.title ? { title: String(v.title).slice(0, 200) } : {}),
                      ...(v.url ? { url: v.url } : {}),
                    });
                }

                const total =
                  counts.critical + counts.high + counts.moderate + counts.low;
                out = { v: 1, counts, total, advisories, ...(ignored.length ? { ignored } : {}) };
              }
            } catch {}

            if (out) {
              console.log("::notice title=audit::MONITOR_AUDIT " + JSON.stringify(out));
            } else {
              console.log("::warning::no readable audit report — emitting no sentinel");
            }
          '
